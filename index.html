  *{box-sizing:border-box;}

  body{

  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--mint);}
  .nav-meta{font-size:13px;color:var(--ink-dim);font-weight:500;}

  .hero{padding:56px 0 40px;}

    color:var(--mint-deep);margin-bottom:26px;
  }
  .hero .eyebrow .pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 1.8s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.5;transform:scale(1.3);}}
  .hero h1{font-size:3.4rem;font-weight:800;letter-spacing:-0.03em;line-height:1.05;margin:0 0 20px;max-width:14ch;}
  .hero p{font-size:1.15rem;color:var(--ink-dim);max-width:52ch;margin:0 0 34px;font-weight:500;}
  .stat-strip{display:flex;gap:36px;flex-wrap:wrap;}
  .stat .num{font-size:2.1rem;font-weight:800;letter-spacing:-0.02em;}
  .stat .lbl{font-size:13px;color:var(--ink-dim);font-weight:500;margin-top:2px;}

  .method{
    background:var(--panel);border-radius:var(--radius);padding:30px 32px;margin:8px 0 40px;
    display:grid;grid-template-columns:1.1fr 1fr;gap:32px;
  }
  .method h3{font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-dim);font-weight:700;margin:0 0 12px;}
  .method p{margin:0;font-size:14.5px;color:var(--ink);font-weight:500;line-height:1.55;}
  .weights{display:flex;flex-direction:column;gap:10px;}
  .weight-row{display:flex;align-items:center;gap:12px;}
  .weight-row .wlabel{font-size:13.5px;font-weight:600;width:150px;flex-shrink:0;}
  .weight-track{flex:1;height:8px;background:var(--panel-2);border-radius:20px;overflow:hidden;}
  .weight-fill{height:100%;border-radius:20px;background:var(--mint);}
  .weight-row .wval{font-size:13px;color:var(--ink-dim);font-weight:600;width:32px;text-align:right;}

  /* CONTROLS */
  .controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:18px;}
  .section-label{font-size:12.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-dim);font-weight:700;margin:0;}
